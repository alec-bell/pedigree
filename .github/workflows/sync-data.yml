name: Sync pedigree-data.json

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract DATA from index.html
        run: python3 scripts/extract-data.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet pedigree-data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pedigree-data.json
            git commit -m "Sync pedigree-data.json from index.html DATA"
            git push
          else
            echo "pedigree-data.json already in sync"
          fi
